# Checks the plugin against PhpStorm's newest releases every week. The plugin
# sets no upper version, so an update that breaks it would otherwise first be
# heard of from someone using it. A failed run means the plugin needs a fix.
name: phpstorm-compat

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build the web bundle
        run: ./bin/wasm

      - name: Verify the plugin
        working-directory: jetbrains
        run: ./gradlew verifyPlugin
