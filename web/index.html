<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dyamark</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f19; }
  #giowindow { width: 100%; height: 100%; }
  #problem { display: none; padding: 16px; font: 14px sans-serif; color: #e6edf3; }
</style>
<script>
  // Messages for the plugin wait here until it has set dyamarkHostPost.
  const started = performance.now();
  const queue = [];
  const elapsed = () => Math.round(performance.now() - started);
  window.dyamarkSend = (message) => {
    if (message === "ready") message = "ready " + elapsed();
    if (window.dyamarkHostPost) window.dyamarkHostPost(message);
    else queue.push(message);
  };
  window.dyamarkHostReady = () => {
    while (queue.length) window.dyamarkHostPost(queue.shift());
  };

  // Gio draws with WebGL; say which there is, for the IDE's log.
  const webgl = (() => {
    const canvas = document.createElement("canvas");
    for (const version of ["webgl2", "webgl"]) {
      const gl = canvas.getContext(version);
      if (!gl) continue;
      const info = gl.getExtension("WEBGL_debug_renderer_info");
      return version + " " + gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER);
    }
    return "none";
  })();
  dyamarkSend("webgl " + webgl);

  const problem = (text) => {
    dyamarkSend("error " + text);
    const p = document.getElementById("problem");
    p.textContent = text;
    p.style.display = "block";
  };
</script>
<script src="wasm_exec.js"></script>
</head>
<body>
<div id="problem"></div>
<div id="giowindow"></div>
<script>
  if (webgl === "none") {
    // Without WebGL Gio draws nothing at all; say so instead.
    problem("dyamark draws with WebGL, and this browser has none: its GPU may be turned off.");
  } else {
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("dyamark.wasm"), go.importObject)
      .then((result) => {
        dyamarkSend("loaded " + elapsed());
        return go.run(result.instance);
      })
      .catch((err) => problem("dyamark couldn't start: " + err));
  }
</script>
</body>
</html>
