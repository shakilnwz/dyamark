<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dyamark</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f19; }
  #giowindow { width: 100%; height: 100%; }
  #problem { display: none; padding: 16px; font: 14px sans-serif; color: #e6edf3; }
</style>
<script>
  // Messages for the plugin wait here until it has set dyamarkHostPost.
  const started = performance.now();
  const queue = [];
  const elapsed = () => Math.round(performance.now() - started);
  window.dyamarkSend = (message) => {
    if (message === "ready") message = "ready " + elapsed();
    if (window.dyamarkHostPost) window.dyamarkHostPost(message);
    else queue.push(message);
  };
  window.dyamarkHostReady = () => {
    while (queue.length) window.dyamarkHostPost(queue.shift());
  };

  // Spike: say which WebGL there is, and which keys reach the page.
  (() => {
    const canvas = document.createElement("canvas");
    let version = "webgl2";
    let gl = canvas.getContext("webgl2");
    if (!gl) { version = "webgl"; gl = canvas.getContext("webgl"); }
    if (!gl) { dyamarkSend("webgl none"); return; }
    const info = gl.getExtension("WEBGL_debug_renderer_info");
    const renderer = info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    dyamarkSend("webgl " + version + " " + renderer);
  })();
  document.addEventListener("keydown", (e) => {
    const mods = (e.ctrlKey ? "Ctrl+" : "") + (e.altKey ? "Alt+" : "") + (e.shiftKey ? "Shift+" : "");
    dyamarkSend("key " + mods + e.key);
  }, true);
</script>
<script src="wasm_exec.js"></script>
</head>
<body>
<div id="problem"></div>
<div id="giowindow"></div>
<script>
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("dyamark.wasm"), go.importObject)
    .then((result) => {
      dyamarkSend("loaded " + elapsed());
      setTimeout(() => dyamarkSend("wasm-memory " + result.instance.exports.mem.buffer.byteLength), 3000);
      return go.run(result.instance);
    })
    .catch((err) => {
      dyamarkSend("error " + err);
      const p = document.getElementById("problem");
      p.textContent = "dyamark couldn't start: " + err;
      p.style.display = "block";
    });
</script>
</body>
</html>
